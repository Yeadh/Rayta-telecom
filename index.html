<meta name="theme-color" content="#1f6feb">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7589;--ac:#1f6feb;--bd:#dde3ee;--ok:#12805c;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#192130;--tx:#e8edf5;--mu:#93a0b6;--ac:#5b9bff;--bd:#2a3550;--ok:#4cd9a0;--bad:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#192130;--tx:#e8edf5;--mu:#93a0b6;--ac:#5b9bff;--bd:#2a3550;--ok:#4cd9a0;--bad:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;font-size:16px;padding-bottom:90px}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.logo{text-align:center;padding:6px 0 12px}
.logo img{width:150px;height:150px;border-radius:22px;background:#fff;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.btn.save{background:linear-gradient(135deg,#1f6feb,#ff8a00);box-shadow:0 4px 12px rgba(31,111,235,.35)}
.btn:active{transform:scale(.98)}
.ci{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.ci:last-child{border:0}
.logo h1{margin:4px 0 0;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lbl{width:92px;font-weight:600;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input{width:100%;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.eq{color:var(--mu);flex:none}
.sum{width:84px;text-align:right;font-weight:700;flex:none}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:4px;flex:none}
.add{width:100%;padding:10px;border:1px dashed var(--ac);color:var(--ac);background:none;border-radius:10px;font-size:15px;font-weight:600}
.btn{width:100%;padding:13px;border:0;background:var(--ac);color:#fff;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px}
.sub{display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:8px;margin-top:6px;font-weight:700}
.line{display:flex;justify-content:space-between;padding:6px 0}
.big{font-size:20px;font-weight:800;border-top:2px solid var(--bd);margin-top:6px;padding-top:10px}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;font-size:13px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac)}
.page{display:none}.page.on{display:block}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:19px;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;overflow-x:auto;padding-bottom:2px}
.bc{flex:1;min-width:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.bl{font-size:10px;color:var(--mu);margin-top:3px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.h{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.h:last-child{border:0}
.hw{border-bottom:1px solid var(--bd)}.hw:last-child{border:0}.hw .h{border:0}
.dd{display:none;background:var(--bg);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px}.dd.on{display:block}
.dd .gh{font-weight:700;display:flex;justify-content:space-between;margin-top:6px}

.lbl{width:118px}
</style>
</head>

<script>
var fmt=function(n){return Number(Math.round(n*100)/100).toLocaleString('bn-BD')};
var num=function(x){var n=parseFloat(x);return isNaN(n)?0:n};
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var G=[['mfs','মোবাইল ব্যাংকিং'],['load','লোড'],['cards','কার্ডস'],['baki','বাকি'],['cashL','ক্যাশ'],['oth','অন্যান্য']];
var lab=function(n){n=Number(n);return n.toLocaleString('bn-BD',n%1?{minimumFractionDigits:2,maximumFractionDigits:2}:{})};
function L(a){return a.map(function(n){return{l:n,v:''}})}
var S={mfs:L(['বিকাশ এজেন্ট','বিকাশ পার্সোনাল ১','বিকাশ পার্সোনাল ২','নগদ']),load:L(['জিপি','বাংলালিংক','রবি','এয়ারটেল']),cards:L([18.8,28.25,38,48]),baki:L(['বাকি ১','বাকি ২']),cashL:L(['নগদ ক্যাশ','বাসা']),capList:null};
var H={},range=7;
try{
  var n3=localStorage.getItem('rayta3');
  if(n3){S=JSON.parse(n3)}else{var o=localStorage.getItem('rayta');if(o){var q=JSON.parse(o);S.capList=q.capList||null;S.cap=q.cap}}
  var h0=localStorage.getItem('rayta_h');if(h0)H=JSON.parse(h0);
}catch(e){}
S.oth=S.oth||[];
if(!S.cv){var CM={20:18.8,30:28.25,40:38,50:48};S.cards.forEach(function(r){if(CM[r.l])r.l=CM[r.l]});S.cv=1}
if(!S.capList){S.capList=[];if(num(S.cap)>0)S.capList.push({d:today(),a:num(S.cap),n:'আগের মূলধন'})}
function save(){try{localStorage.setItem('rayta3',JSON.stringify(S));localStorage.setItem('rayta_h',JSON.stringify(H))}catch(e){}}
function resetAll(){
  if(!confirm('সব ডেটা মুছে যাবে এবং আর ফেরত পাওয়া যাবে না। নিশ্চিত?'))return;
  if(!confirm('শেষবার জিজ্ঞাসা: সত্যিই রিসেট করবেন?'))return;
  try{['rayta3','rayta','rayta_h'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}
  location.reload();
}
function capTotal(){var t=0;S.capList.forEach(function(e){t+=num(e.a)});return t}
function go(p){
  document.querySelectorAll('.page').forEach(function(e){e.classList.remove('on')});
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  if(p==='rep')report();window.scrollTo(0,0);
}
function render(){
  var h='<h2>হিসাব</h2>';
  G.forEach(function(g){
    var k=g[0];
    S[k].forEach(function(r,i){
      if(k==='cards'){
        h+='<div class="row"><span class="lbl">'+lab(r.l)+' ×</span><input type="number" inputmode="numeric" placeholder="সংখ্যা" value="'+r.v+'" oninput="upd(\''+k+'\','+i+',this.value)"><span class="eq">=</span><span class="sum" id="'+k+i+'">'+fmt(num(r.l)*num(r.v))+'</span><button class="x" onclick="del(\''+k+'\','+i+')">×</button></div>';
      }else{
        h+='<div class="row"><span class="lbl">'+r.l+'</span><input type="number" inputmode="decimal" placeholder="টাকা" value="'+r.v+'" oninput="upd(\''+k+'\','+i+',this.value)"><button class="x" onclick="del(\''+k+'\','+i+')">×</button></div>';
      }
    });
  });
  h+='<button class="add" onclick="addItem()">+ নতুন যোগ করুন</button><div class="line big"><span>সর্বমোট</span><span id="gt">0</span></div>';
  document.getElementById('groups').innerHTML=h;
  renderCap();calc();
}
function upd(k,i,v){S[k][i].v=v;if(k==='cards')document.getElementById(k+i).textContent=fmt(num(S[k][i].l)*num(v));calc()}
function del(k,i){S[k].splice(i,1);render()}
function addItem(){
  var n=prompt('কার্ডের পরিমাণ (যেমন 60) বা নতুন ঘরের নাম লিখুন:');
  if(!n||!n.trim())return;n=n.trim();
  if(/^[0-9]+(\.[0-9]+)?$/.test(n))S.cards.push({l:num(n),v:''});else S.oth.push({l:n,v:''});
  render();
}
function totals(){
  var t={c:0,l:0,m:0,k:0,b:0,o:0};
  S.cards.forEach(function(r){t.c+=num(r.l)*num(r.v)});
  S.load.forEach(function(r){t.l+=num(r.v)});
  S.mfs.forEach(function(r){t.m+=num(r.v)});
  S.baki.forEach(function(r){t.b+=num(r.v)});
  S.cashL.forEach(function(r){t.k+=num(r.v)});
  S.oth.forEach(function(r){t.o+=num(r.v)});
  t.g=t.c+t.l+t.m+t.k+t.b+t.o;return t;
}
function calc(){
  var t=totals(),p=t.g-capTotal();
  var set=function(id,v){document.getElementById(id).textContent=fmt(v)};
  set('gt',t.g);
  set('capv',capTotal());set('hc',capTotal());set('pf',p);
  document.getElementById('pf').className=p<0?'neg':'pos';
  save();
}
function addCap(){S.capList.push({a:'',n:''});renderCap();var i=document.querySelectorAll('.cin');if(i.length)i[i.length-1].focus()}
function capUpd(i,v){S.capList[i].a=v;calc()}
function delCap(i){if(num(S.capList[i].a)>0&&!confirm('এই মূলধন মুছবেন?'))return;S.capList.splice(i,1);renderCap();calc()}
function renderCap(){
  if(!S.capList.length)S.capList.push({a:'',n:''});
  document.getElementById('clist').innerHTML=S.capList.map(function(e,i){
    return '<div class="row"><span class="lbl">'+(e.n||('মূলধন '+fmt(i+1)))+'</span><input class="cin" type="number" inputmode="decimal" placeholder="টাকা" value="'+e.a+'" oninput="capUpd('+i+',this.value)"><button class="x" onclick="delCap('+i+')">×</button></div>';
  }).join('');
  document.getElementById('capv').textContent=fmt(capTotal());
}
function saveDay(){
  var t=totals(),d=today(),msg=document.getElementById('saved');
  if(t.g<=0){msg.textContent='আগে হিসাব লিখুন, তারপর সেভ করুন';return}
  var o=H[d]||{};
  if(H[d]&&!confirm('আজকের হিসাব আগেই সেভ করা আছে। নতুন হিসাব তার সাথে যোগ হবে। ঠিক আছে?'))return;
  var e={};['c','l','m','k','b','o'].forEach(function(f){e[f]=t[f]+(o[f]||0)});
  e.g=e.c+e.l+e.m+e.k+e.b+e.o;e.cap=capTotal();e.p=e.g-capTotal();
  var prev=o.sess||(H[d]?[{t:'',tot:{c:o.c||0,l:o.l||0,m:o.m||0,k:o.k||0,b:o.b||0,o:o.o||0}}]:[]);
  var items=[];
  G.forEach(function(g){S[g[0]].forEach(function(r){if(r.v===''||r.v==null)return;var v=num(r.v);
    if(g[0]==='cards')items.push({k:'cards',l:r.l,q:v,v:num(r.l)*v});else items.push({k:g[0],l:r.l,v:v})})});
  var tm=new Date();
  var cp=[];S.capList.forEach(function(c,n){if(c.a!==''&&c.a!=null)cp.push({l:c.n||('মূলধন '+fmt(n+1)),v:num(c.a)})});
  e.sess=prev.concat([{t:('0'+tm.getHours()).slice(-2)+':'+('0'+tm.getMinutes()).slice(-2),i:items,cp:cp}]);
  H[d]=e;
  G.forEach(function(g){S[g[0]].forEach(function(r){r.v=''})});
  render();window.scrollTo(0,0);
  msg.textContent='✓ '+new Date().toLocaleDateString('bn-BD')+' এর হিসাব সেভ হয়েছে, ঘরগুলো খালি করা হয়েছে';
}
function setRange(n){range=n;report()}
function report(){
  var rs=[[7,'সপ্তাহ'],[30,'মাস'],[183,'৬ মাস'],[365,'বছর']];
  document.getElementById('tabs').innerHTML=rs.map(function(r){return '<button class="'+(r[0]===range?'on':'')+'" onclick="setRange('+r[0]+')">'+r[1]+'</button>'}).join('');
  var cut=new Date();cut.setDate(cut.getDate()-range+1);
  var cs=cut.getFullYear()+'-'+('0'+(cut.getMonth()+1)).slice(-2)+'-'+('0'+cut.getDate()).slice(-2);
  var keys=Object.keys(H).filter(function(x){return x>=cs}).sort();
  var T={g:0,p:0,c:0,l:0,m:0,k:0,b:0,o:0};
  keys.forEach(function(x){for(var f in T)T[f]+=(H[x][f]||0)});
  var set=function(id,v){document.getElementById(id).textContent=fmt(v)};
  set('r-d',keys.length);set('r-g',T.g);set('r-p',T.p);set('r-a',keys.length?T.p/keys.length:0);
  set('r-c',T.c);set('r-l',T.l);set('r-m',T.m);set('r-k',T.k);set('r-b',T.b);set('r-o',T.o);
  document.getElementById('r-p').className=T.p<0?'neg':'pos';
  var grp={},monthly=range>40;
  keys.forEach(function(x){var key=monthly?x.slice(0,7):x;grp[key]=(grp[key]||0)+H[x].p});
  var gk=Object.keys(grp).sort(),mx=1;
  gk.forEach(function(x){mx=Math.max(mx,Math.abs(grp[x]))});
  document.getElementById('bars').innerHTML=gk.length?gk.map(function(x){
    var v=grp[x],hp=Math.max(2,Math.abs(v)/mx*85);
    var lb=monthly?new Date(x+'-01').toLocaleDateString('bn-BD',{month:'short'}):fmt(parseInt(x.slice(8)));
    return '<div class="bc"><div class="bar" style="height:'+hp+'%;background:var(--'+(v<0?'bad':'ok')+')"></div><div class="bl">'+lb+'</div></div>';
  }).join(''):'<div class="mu">এই সময়ে কোনো সেভ করা হিসাব নেই</div>';
  document.getElementById('bn').textContent=monthly?'মাস অনুযায়ী লাভ':'দিন অনুযায়ী লাভ';
  document.getElementById('list').innerHTML=keys.length?keys.slice().reverse().map(function(x){
    var e=H[x];
    return '<div class="hw"><div class="h"><div style="cursor:pointer;flex:1" onclick="togDay(\''+x+'\')"><b>'+new Date(x).toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'})+'</b> <span class="mu">▾ বিস্তারিত</span><div class="mu">বিক্রি '+fmt(e.g)+' · মূলধন '+fmt(e.cap)+'</div></div><div style="display:flex;align-items:center;gap:6px"><b class="'+(e.p<0?'neg':'pos')+'">'+fmt(e.p)+'</b><button class="x" onclick="delDay(\''+x+'\')">×</button></div></div><div class="dd" id="dd-'+x+'"></div></div>';
  }).join(''):'<div class="mu">কোনো তথ্য নেই। হিসাব পেজে "সেভ করুন" চাপুন।</div>';
}
function dayDetail(x){
  var e=H[x],TL={c:'কার্ডস',l:'লোড',m:'মোবাইল ব্যাংকিং',k:'ক্যাশ',b:'বাকি',o:'অন্যান্য'};
  var ss=e.sess||[{t:'',tot:{c:e.c,l:e.l,m:e.m,k:e.k,b:e.b,o:e.o}}];
  var multi=ss.length>1,h='';
  var ln=function(a,b){return '<div class="line" style="padding:3px 0"><span>'+a+'</span><span>'+fmt(b)+'</span></div>'};
  ss.forEach(function(s,n){
    if(multi)h+='<div class="mu" style="margin:8px 0 2px;border-top:1px dashed var(--bd);padding-top:6px">'+(s.t?'সেভ '+fmt(n+1)+' · '+s.t:'আগের সেভ')+'</div>';
    if(s.tot){
      for(var f in TL){if(num(s.tot[f])>0)h+=ln(TL[f],s.tot[f])}
      h+='<div class="mu">এই সেভে আলাদা লেনদেন রাখা ছিল না, শুধু খাতভিত্তিক মোট আছে।</div>';
    }else{
      s.i.forEach(function(r){h+=ln(r.k==='cards'?lab(r.l)+' × '+fmt(r.q):r.l,r.v)});
      if(s.cp&&s.cp.length){
        s.cp.forEach(function(r){h+=ln(r.l,r.v)});
      }
    }
  });
  return h||'<div class="mu">কোনো লেনদেন নেই</div>';
}
function togDay(x){
  var el=document.getElementById('dd-'+x);
  if(!el.classList.contains('on'))el.innerHTML=dayDetail(x);
  el.classList.toggle('on');
}
function delDay(k){if(confirm('এই দিনের হিসাব মুছবেন?')){delete H[k];save();report()}}
render();
</script>
</body>
</html>
