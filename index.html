<meta name="theme-color" content="#1f6feb">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7589;--ac:#1f6feb;--bd:#dde3ee;--ok:#12805c;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#192130;--tx:#e8edf5;--mu:#93a0b6;--ac:#5b9bff;--bd:#2a3550;--ok:#4cd9a0;--bad:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#192130;--tx:#e8edf5;--mu:#93a0b6;--ac:#5b9bff;--bd:#2a3550;--ok:#4cd9a0;--bad:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif;font-size:16px;padding-bottom:90px}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.logo{text-align:center;padding:6px 0 12px}
.logo img{width:150px;height:150px;border-radius:22px;background:#fff;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.btn.save{background:linear-gradient(135deg,#1f6feb,#ff8a00);box-shadow:0 4px 12px rgba(31,111,235,.35)}
.btn:active{transform:scale(.98)}
.ci{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.ci:last-child{border:0}
.logo h1{margin:4px 0 0;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lbl{width:92px;font-weight:600;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input{width:100%;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.eq{color:var(--mu);flex:none}
.sum{width:84px;text-align:right;font-weight:700;flex:none}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:4px;flex:none}
.add{width:100%;padding:10px;border:1px dashed var(--ac);color:var(--ac);background:none;border-radius:10px;font-size:15px;font-weight:600}
.btn{width:100%;padding:13px;border:0;background:var(--ac);color:#fff;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px}
.sub{display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:8px;margin-top:6px;font-weight:700}
.line{display:flex;justify-content:space-between;padding:6px 0}
.big{font-size:20px;font-weight:800;border-top:2px solid var(--bd);margin-top:6px;padding-top:10px}
